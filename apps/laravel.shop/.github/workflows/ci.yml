name: CI Validation

on:
  workflow_call:
    inputs:
      skip-php-tests:
        description: "Skip PHP tests and Pint"
        type: boolean
        default: false
      skip-npm-tests:
        description: "Skip npm lint, typecheck, format, test, and build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    uses: nreljed/platform/.github/workflows/consumer-ci.yml@main
    with:
      skip-php-tests: ${{ inputs.skip-php-tests || false }}
      skip-npm-tests: ${{ inputs.skip-npm-tests || false }}
      php-tests-parallel: false
      pass-with-no-tests: false
      # The called workflow cannot read this repo's `vars`, so the runner
      # switch is handed over as inputs (see consumer-ci.yml's header).
      runner: ${{ vars.RUNNER_CI || 'self-hosted' }}
      hosted-runner: ${{ vars.RUNNER_CI != 'self-hosted' }}
      run-e2e: true
    secrets: inherit