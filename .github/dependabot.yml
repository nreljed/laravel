version: 2
updates:
  # Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    ignore:
      # @typescript-eslint has no TypeScript 7 support yet — see AGENTS.md
      # "Known Blockers". Bumping to 7.x breaks the ESLint pipeline.
      - dependency-name: "typescript"
        versions: ["7.x"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Composer ecosystem intentionally removed — nreljed/* private VCS deps
  # break dependabot auth, and package updates are handled by core-update.yml.

  # GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
