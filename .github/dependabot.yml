version: 2
updates:
  # Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # directory: "/" is the pnpm workspace root. Two constraints combine:
    #  1. packages/** are released-package MIRRORS (owned by their own repos)
    #     and apps/** must stay byte-identical to the standalone deploy repos,
    #     so any Dependabot edit to their package.json fails
    #     check-platform-consistency (mirror/app drift).
    #  2. Dependabot's pnpm-workspace support rewrites every member package.json
    #     to keep the shared lockfile consistent, and it does NOT honor
    #     exclude-paths for workspace members (dependabot-core#10758) - so
    #     exclude-paths alone does not protect the mirrors.
    # lockfile-only is the lever that actually holds: PRs touch only
    # pnpm-lock.yaml, never a package.json, so mirrors/apps cannot drift.
    # Declared ranges (root + package/app) are bumped upstream in the owning
    # repo, then synced.
    versioning-strategy: lockfile-only
    exclude-paths:
      - "packages/**"
      - "apps/**"
    ignore:
      # @typescript-eslint has no TypeScript 7 support yet - see AGENTS.md
      # "Known Blockers". Bumping to 7.x breaks the ESLint pipeline.
      - dependency-name: "typescript"
        versions: ["7.x"]
      # Core's peer range is ^0.49.0 (pre-1.0 semver: <0.50.0). A lexical
      # 0.50 bump needs a coordinated core peer-range bump first - dependabot
      # auto-bumps would fail the check:core-deps parity gate.
      - dependency-name: "lexical"
        versions: [">=0.50.0"]
      - dependency-name: "@lexical/*"
        versions: [">=0.50.0"]
      # cn is a required core peer (^0.2.6). App-level bumps to 0.3.x fail
      # the check-core-deps parity gate. Platform controls the cn version.
      - dependency-name: "cn"
        versions: [">=0.3.0"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Composer ecosystem intentionally removed - nreljed/* private VCS deps
  # break dependabot auth, and package updates are handled by core-update.yml.

  # GitHub Actions ecosystem intentionally removed - workflows reference
  # private reusable workflows (nreljed/platform/.github/workflows/...@main)
  # that dependabot cannot auth to, so every github-actions run fails with
  # git_dependencies_not_reachable. Action pin updates are handled manually.
