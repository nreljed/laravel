name: FTP Repair / Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "partial = upload listed paths only | full = build + sync whole app"
        required: true
        type: choice
        options:
          - partial
          - full
        default: partial
      source_ref:
        description: "Git ref to take files from (tag, branch, or commit SHA)"
        required: false
        default: "main"
      paths:
        description: "Newline-separated repo-relative files/dirs to upload (partial mode)"
        required: false
        default: "app/TestPosts/TestPostsServiceProvider.php"
      remote_base:
        description: "Remote base dir under FTP root (e.g. /public_html or /)"
        required: false
        default: "/public_html"
      probe_only:
        description: "Only list remote dirs to map the FTP layout, then stop"
        required: false
        type: boolean
        default: false
      delete_stale:
        description: "Delete remote files not present locally (full sync only). Use for recovery when server tree is mixed/stale."
        required: false
        type: boolean
        default: false

jobs:
  ftp-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Configure FTP credentials
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          printf 'machine %s login %s password %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASS" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Probe remote layout
        if: inputs.probe_only == true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          set -x
          PORT="${FTP_PORT:-21}"
          timeout 90 lftp -u "$FTP_USER" -p "$PORT" "$FTP_HOST" -e "set net:timeout 15; set net:max-retries 1; set net:reconnect-interval-base 1; set ftp:passive-mode on; set ftp:ssl-allow false; ls -la; echo === app; ls app 2>&1; echo === bootstrap; ls bootstrap 2>&1; echo === config; ls config 2>&1; echo === database; ls database 2>&1; echo === storage; ls storage 2>&1; echo === resources; ls resources 2>&1; echo === routes; ls routes 2>&1; echo === artisan; ls artisan 2>&1; echo === dotenv; ls .env 2>&1; quit" || echo "LFTP_PROBE_EXIT=$?"

      - name: Upload paths (partial mode)
        if: inputs.mode == 'partial' && inputs.probe_only != true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          REMOTE_BASE: ${{ inputs.remote_base }}
        run: |
          set -e
          PORT="${FTP_PORT:-21}"
          while IFS= read -r P; do
            [ -z "$P" ] && continue
            case "$P" in
              *.env|*.env.*|*/\.env*) echo "Refusing .env upload: $P"; exit 1 ;;
            esac
            [ -e "$P" ] || { echo "Missing local path: $P"; exit 1; }
            REMOTE_DIR="$REMOTE_BASE/$(dirname "$P")"
            if [ -f "$P" ]; then
              echo "Uploading file: $P -> $REMOTE_DIR"
              timeout 120 lftp -u "$FTP_USER" -p "$PORT" "$FTP_HOST" -e "set net:timeout 15; set net:max-retries 2; set ftp:passive-mode on; set ftp:ssl-allow false; mkdir -p '$REMOTE_DIR'; put -O '$REMOTE_DIR' '$P'; quit" || { echo "FAILED: $P"; exit 1; }
            else
              echo "Mirroring dir: $P -> $REMOTE_DIR"
              timeout 600 lftp -u "$FTP_USER" -p "$PORT" "$FTP_HOST" -e "set net:timeout 15; set net:max-retries 2; set ftp:passive-mode on; set ftp:ssl-allow false; mkdir -p '$REMOTE_DIR'; mirror -R --parallel=4 --no-empty-dirs '$P' '$REMOTE_DIR'; quit" || { echo "FAILED: $P"; exit 1; }
            fi
          done <<< "${{ inputs.paths }}"

      - name: Setup PHP
        if: inputs.mode == 'full' && inputs.probe_only != true
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Setup Node
        if: inputs.mode == 'full' && inputs.probe_only != true
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build app (full mode)
        if: inputs.mode == 'full' && inputs.probe_only != true
        shell: bash
        run: |
          set -e
          DB_PATH="$(pwd)/database/database.sqlite"
          cat > .env <<EOF
          APP_NAME=Laravel
          APP_ENV=local
          APP_KEY=base64:pHIa377aV0cusfWxNM2X3bpkWnRpztIQFwBGevG2DaY=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=$DB_PATH
          SESSION_DRIVER=file
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          DEPLOY_TOKEN=build
          GITHUB_TOKEN=build
          EOF
          touch database/database.sqlite
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-scripts
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          rm -f .env

      - name: Sync full app (full mode)
        if: inputs.mode == 'full' && inputs.probe_only != true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          REMOTE_BASE: ${{ inputs.remote_base }}
        run: |
          set -e
          PORT="${FTP_PORT:-21}"
          DEL_ARGS=""
          if [ "${{ inputs.delete_stale }}" = "true" ]; then DEL_ARGS="--delete"; fi
          BASE="$REMOTE_BASE"
          for DIR in artisan composer.json composer.lock app bootstrap config database/migrations database/seeders public resources routes vendor deploy.php; do
            [ -e "$DIR" ] || { echo "Skipping missing: $DIR"; continue; }
            echo "Syncing: $DIR"
            if [ -f "$DIR" ]; then
              timeout 1800 lftp -u "$FTP_USER" -p "$PORT" "$FTP_HOST" -e "set net:timeout 15; set net:max-retries 2; set ftp:passive-mode on; set ftp:ssl-allow false; mkdir -p '$BASE'; put -O '$BASE' '$DIR'; quit" || { echo "FAILED: $DIR"; exit 1; }
            else
              timeout 1800 lftp -u "$FTP_USER" -p "$PORT" "$FTP_HOST" -e "set net:timeout 15; set net:max-retries 2; set ftp:passive-mode on; set ftp:ssl-allow false; mirror -R --parallel=4 --no-empty-dirs $DEL_ARGS '$DIR' '$BASE/$DIR'; quit" || { echo "FAILED: $DIR"; exit 1; }
            fi
          done
