name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Install NPM Dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Assets
        run: npm run build

      - name: Create Deploy Archive
        shell: pwsh
        run: |
          $src = Get-Location
          $zip = "$src\deploy.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          $items = @(
            "artisan", "composer.json", "composer.lock", "package.json", "package-lock.json",
            "app", "bootstrap", "config", "database", "public", "resources", "routes",
            "scripts/deploy-cron.php", "storage", "vendor"
          )
          $fullPaths = $items | ForEach-Object { Join-Path $src $_ }
          Compress-Archive -Path $fullPaths -DestinationPath $zip -CompressionLevel Optimal
          $size = [Math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Output "deploy.zip created: $size MB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "deploy-${{ github.run_number }}-${{ github.run_attempt }}"
          name: "Deploy #${{ github.run_number }}"
          body: "Production deploy from ${{ github.sha }}"
          files: deploy.zip
          fail_on_unmatched_files: true