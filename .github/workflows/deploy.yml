name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip
          
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-dev
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install NPM Dependencies
        run: npm ci --ignore-scripts
        
      - name: Build Assets
        run: npm run build
        
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/advertis/domains/laravel.tunispromo.tn/public_html/
          git-exclude: true
          exclude: |
            .git/**
            .github/**
            .gitignore
            .gitattributes
            node_modules/**
            storage/*.log
            README.md
            phpunit.xml
            tests/**
            .env.production.example
            deploy.sh
            sql/**
      
      - name: Update Production .env
        env:
          ENV_CONTENT: |
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=https://laravel.tunispromo.tn
            APP_LOCALE=en
            APP_FALLBACK_LOCALE=en
            BCRYPT_ROUNDS=12
            LOG_CHANNEL=stack
            LOG_LEVEL=error
            DB_CONNECTION=mysql
            DB_HOST=localhost
            DB_PORT=3306
            DB_DATABASE=advertis_lara584
            DB_USERNAME=advertis_lara584
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SESSION_DRIVER=database
            SESSION_LIFETIME=120
            SESSION_DOMAIN=.tunispromo.tn
            BROADCAST_CONNECTION=log
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=database
            CACHE_STORE=file
            DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
        run: |
          TEMP_ENV=$(printf '%s\n' "$ENV_CONTENT")
          curl -X POST "https://laravel.tunispromo.tn/deploy/update-env" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "token=${{ secrets.DEPLOY_TOKEN }}" \
            --data-urlencode "content=$TEMP_ENV" || echo "Env update skipped (may already exist)"
        continue-on-error: true
      
      - name: Clear Cache and Migrate
        run: |
          curl -s "https://laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}" || echo "Cache clear completed"