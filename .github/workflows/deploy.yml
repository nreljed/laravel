name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Generate Production .env
        run: |
          @'
          APP_NAME=Laravel
          APP_ENV=production
          APP_KEY=base64:pHIa377aV0cusfWxNM2X3bpkWnRpztIQFwBGevG2DaY=
          APP_DEBUG=false
          APP_URL=https://laravel.tunispromo.tn
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=advertis_lara584
          DB_USERNAME=advertis_lara584
          DB_PASSWORD=9)24p375S!
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_DOMAIN=.tunispromo.tn
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          '@ | Set-Content -Path .env -Encoding UTF8
          New-Item -ItemType File -Path database/database.sqlite -Force

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Install NPM Dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Assets
        run: npm run build

      - name: Copy deploy script to root
        run: Copy-Item -Path scripts/deploy-cron.php -Destination deploy.php

      - name: Create Deploy Archive
        shell: pwsh
        run: |
          $src = Get-Location
          $zip = "$src\deploy.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          # Move runtime cache out so it doesn't overwrite the server's cached routes/config
          if (Test-Path "$src\bootstrap\cache") {
            Move-Item "$src\bootstrap\cache" "$src\bootstrap\cache.bak"
          }
          $items = @(
            "artisan", "composer.json", "composer.lock", "package.json", "package-lock.json",
            "app", "bootstrap", "config", "database", "public", "resources", "routes",
            "storage", "vendor", ".env", "deploy.php"
          )
          $fullPaths = $items | ForEach-Object { Join-Path $src $_ }
          Compress-Archive -Path $fullPaths -DestinationPath $zip -CompressionLevel Optimal
          $size = [Math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Output "deploy.zip created: $size MB"
          # Restore cache directory
          if (Test-Path "$src\bootstrap\cache.bak") {
            Remove-Item "$src\bootstrap\cache" -Recurse -Force -ErrorAction SilentlyContinue
            Move-Item "$src\bootstrap\cache.bak" "$src\bootstrap\cache"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "deploy-${{ github.run_number }}-${{ github.run_attempt }}"
          name: "Deploy #${{ github.run_number }}"
          body: "Production deploy from ${{ github.sha }}"
          files: deploy.zip
          fail_on_unmatched_files: true