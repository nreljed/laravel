name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip
          
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-dev
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install NPM Dependencies
        run: npm ci --ignore-scripts
        
      - name: Build Assets
        run: npm run build
        
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/advertis/domains/laravel.tunispromo.tn/public_html/
          git-exclude: true
          exclude: |
            .git/**
            .github/**
            .gitignore
            .gitattributes
            node_modules/**
            storage/*.log
            .env
            README.md
            phpunit.xml
            tests/**
            .env.production.example
            deploy.sh
      
      - name: Clear Cache and Migrate
        run: |
          curl -s "https://laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}" || echo "Cache clear endpoint not available (may need SSH)"