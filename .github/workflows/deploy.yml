name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    needs: ci
    uses: ./.github/workflows/deploy-package.yml
    with:
      version: ""
    secrets: inherit

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes
        run: |
          npm install -g git-cliff
          BASE_TAG=$(git tag --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$BASE_TAG" ]; then
            BASE_TAG="v0.1.0"
          fi
          echo "Release notes base: $BASE_TAG"
          git-cliff "$BASE_TAG..HEAD" --strip header -o release-notes.md 2>/dev/null || echo "No changes for v${{ needs.package.outputs.version }}" > release-notes.md
          git-cliff -o CHANGELOG.md 2>/dev/null || true

      - name: Download deploy.zip artifact
        uses: actions/download-artifact@v8
        with:
          name: deploy-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: "v${{ needs.package.outputs.version }}"
          name: "v${{ needs.package.outputs.version }}"
          body_path: release-notes.md
          files: deploy.zip
          fail_on_unmatched_files: true

  push-deploy:
    needs: [package, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download deploy.zip artifact
        uses: actions/download-artifact@v8
        with:
          name: deploy-package

      - name: Upload deploy archive to server
        shell: bash
        run: |
          VER="v${{ needs.package.outputs.version }}"
          APP_URL="${{ vars.APP_URL }}"
          DEPLOY_TOKEN="${{ secrets.DEPLOY_TOKEN }}"
          echo "Release: $VER"

          # Try direct upload first. A non-zero curl exit (e.g. timeout, exit 28)
          # must not abort the step (set -e) — fall through to /deploy/check.
          UPLOAD_RESP=$(curl -s -w "\n%{http_code}" --max-time 300 \
            -F "file=@deploy.zip;filename=deploy.zip" \
            "$APP_URL/deploy/upload?token=$DEPLOY_TOKEN" 2>&1 || true)
          UPLOAD_CODE=$(echo "$UPLOAD_RESP" | tail -1)
          UPLOAD_BODY=$(echo "$UPLOAD_RESP" | sed '$d')

          if [ "$UPLOAD_CODE" = "200" ] && echo "$UPLOAD_BODY" | grep -q '"status":"deployed"'; then
            echo "Deployed via /deploy/upload"
            echo "$UPLOAD_BODY"
            exit 0
          fi

          echo "Upload failed (HTTP $UPLOAD_CODE); falling back to /deploy/check"
          echo "Upload response: $(echo "$UPLOAD_BODY" | head -c 500)"

          # Fallback: server pulls latest release from the GitHub API.
          # The host's security layer intermittently answers CI (datacenter) IPs
          # with a 200/HTML block page, so retry a few times to ride it through.
          for i in 1 2 3 4 5; do
            CHECK_RESP=$(curl -s -w "\n%{http_code}" --max-time 300 -X POST \
              -H "User-Agent: GitHub-Actions-Deploy" -H "Accept: application/json" \
              "$APP_URL/deploy/check?token=$DEPLOY_TOKEN" 2>&1 || true)
            CHECK_CODE=$(echo "$CHECK_RESP" | tail -1)
            CHECK_BODY=$(echo "$CHECK_RESP" | sed '$d')

            if [ "$CHECK_CODE" = "200" ] && echo "$CHECK_BODY" | grep -q '"status":"deployed"'; then
              echo "Deployed via /deploy/check (GitHub API)"
              echo "$CHECK_BODY"
              exit 0
            fi

            if [ "$CHECK_CODE" = "200" ] && echo "$CHECK_BODY" | grep -q '"status":"current"'; then
              echo "Server already up to date via /deploy/check"
              echo "$CHECK_BODY"
              exit 0
            fi

            echo "Check attempt $i: HTTP $CHECK_CODE, not deployed. $(echo "$CHECK_BODY" | head -c 300)"
            sleep 30
          done

          echo "Deploy failed (upload HTTP $UPLOAD_CODE, check HTTP $CHECK_CODE after retries)."
          echo "Check response: $(echo "$CHECK_BODY" | head -c 500)"
          echo "Release created at:"
          echo "https://github.com/${{ github.repository }}/releases/tag/$VER"
          echo "Manual deploy: download deploy.zip from release, upload to server, extract, then visit:"
          echo "$APP_URL/deploy/cache-clear?token=$DEPLOY_TOKEN"
          exit 1
