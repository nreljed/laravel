name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Laravel Environment
        run: |
          Copy-Item .env.example .env
          New-Item -ItemType File -Path database/database.sqlite -Force

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Install NPM Dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Assets
        run: npm run build

      - name: Verify FTP Credentials
        run: |
          Write-Output "Testing FTP connection to ${{ secrets.FTP_SERVER }}..."
          Write-Output "Proxy env: HTTP_PROXY=$env:HTTP_PROXY HTTPS_PROXY=$env:HTTPS_PROXY NO_PROXY=$env:NO_PROXY"
          $result = curl.exe --noproxy "*" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" --list-only --silent --show-error ftp://${{ secrets.FTP_SERVER }}/ 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "FTP connection FAILED: $result"
            exit 1
          }
          Write-Output "FTP connection OK. Found files:"
          $result

      - name: Deploy via FTP (PowerShell 7 + curl)
        shell: pwsh
        run: |
          $exclude = @(
            ".git/**", ".github/**", ".gitignore", ".gitattributes",
            ".env", ".env.example", ".env.production.example",
            "database/database.sqlite",
            "node_modules/**",
            "storage/**",
            "vendor/bin/**", "vendor/**/tests/**", "vendor/**/test/**", "vendor/**/docs/**",
            "bootstrap/cache/*",
            "public/hot", "public/build/hot",
            "README.md", "phpunit.xml",
            "tests/**", "docs/**", "scripts/**", "sql/**",
            "deploy.sh", "composer-setup.php", "composer.phar",
            "*.md"
          )
          & ".\scripts\deploy-ftp.ps1" -Server "${{ secrets.FTP_SERVER }}" -Username "${{ secrets.FTP_USERNAME }}" -Password "${{ secrets.FTP_PASSWORD }}" -RemoteRoot "/home/advertis/domains/laravel.tunispromo.tn/public_html/" -LocalRoot "." -Exclude $exclude

      - name: Update Production .env
        env:
          ENV_CONTENT: |
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=https://laravel.tunispromo.tn
            APP_LOCALE=en
            APP_FALLBACK_LOCALE=en
            BCRYPT_ROUNDS=12
            LOG_CHANNEL=stack
            LOG_LEVEL=error
            DB_CONNECTION=mysql
            DB_HOST=localhost
            DB_PORT=3306
            DB_DATABASE=advertis_lara584
            DB_USERNAME=advertis_lara584
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SESSION_DRIVER=database
            SESSION_LIFETIME=120
            SESSION_DOMAIN=.tunispromo.tn
            BROADCAST_CONNECTION=log
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=database
            CACHE_STORE=file
            DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
        run: |
          $body = @{
            token = "${{ secrets.DEPLOY_TOKEN }}"
            content = $env:ENV_CONTENT
          }
          Invoke-RestMethod -Uri "https://laravel.tunispromo.tn/deploy/update-env" -Method Post -Body $body

      - name: Clear Cache and Migrate
        run: |
          Invoke-RestMethod -Uri "https://laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
