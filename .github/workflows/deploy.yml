name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Determine version & generate changelog
        id: version
        shell: pwsh
        run: |
          $gcUrl = "https://github.com/orhun/git-cliff/releases/download/v2.8.0/git-cliff-2.8.0-x86_64-pc-windows-msvc.zip"
          $gcZip = "$env:TEMP\git-cliff.zip"
          Invoke-WebRequest -Uri $gcUrl -OutFile $gcZip -ErrorAction Stop
          Expand-Archive -Path $gcZip -DestinationPath "$env:TEMP\git-cliff" -Force
          $gc = Get-ChildItem -Path "$env:TEMP\git-cliff" -Recurse -Filter "git-cliff.exe" | Select-Object -First 1 -ExpandProperty FullName
          # Try to get bumped version, fall back to 0.1.0 if git-cliff fails
          $ver = "0.1.0"
          try {
            & $gc --bumped-version | Set-Content version.txt -NoNewline -ErrorAction Stop
            $ver = (Get-Content version.txt -Raw -ErrorAction Stop).Trim()
          } catch {
            Write-Output "git-cliff version detection failed, using 0.1.0: $_"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          & $gc --unreleased -o release-notes.md 2>$null
          if (-not (Test-Path release-notes.md)) { Set-Content release-notes.md -Value "No changes for v$ver" }
          & $gc -o CHANGELOG.md 2>$null

      - name: Generate Build .env (SQLite for build process)
        run: |
          $dbPath = "$((Get-Location).Path.Replace('\', '/'))/database/database.sqlite"
          @"
          APP_NAME=Laravel
          APP_ENV=local
          APP_KEY=base64:pHIa377aV0cusfWxNM2X3bpkWnRpztIQFwBGevG2DaY=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=$dbPath
          SESSION_DRIVER=file
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          DEPLOY_TOKEN=build
          GITHUB_TOKEN=build
          "@ | Set-Content -Path .env -Encoding UTF8
          New-Item -ItemType File -Path database/database.sqlite -Force

      - name: Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer Dependencies (with dev)
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Package Discover
        run: php artisan package:discover --ansi

      - name: Run migrations (SQLite build)
        run: php artisan migrate --force

      - name: Cache npm dependencies
        id: npm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install NPM Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck & Lint
        run: npm run typecheck && npm run lint && npm run format:check

      - name: Frontend Tests
        run: npm run test

      - name: Build Assets
        run: npm run build

      - name: PHP Tests
        run: php artisan test

      - name: PHP Code Style (Pint)
        run: vendor/bin/pint

      - name: Strip dev dependencies for production
        run: composer install --no-dev --optimize-autoloader --no-scripts

      - name: Overwrite .env with Production Settings
        run: |
          @'
          APP_NAME=Laravel
          APP_ENV=production
          APP_KEY=base64:pHIa377aV0cusfWxNM2X3bpkWnRpztIQFwBGevG2DaY=
          APP_DEBUG=false
          APP_URL=https://laravel.tunispromo.tn
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_DOMAIN=.tunispromo.tn
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          '@ | Set-Content -Path .env -Encoding UTF8

      - name: Copy deploy script to root
        run: Copy-Item -Path scripts/deploy-cron.php -Destination deploy.php

      - name: Create Deploy Archive
        shell: pwsh
        run: |
          $src = Get-Location
          $zip = "$src\deploy.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          # Move runtime cache out so it doesn't overwrite the server's cached routes/config
          if (Test-Path "$src\bootstrap\cache") {
            Move-Item "$src\bootstrap\cache" "$src\bootstrap\cache.bak"
          }
          $items = @(
            "artisan", "composer.json", "composer.lock", "package.json", "package-lock.json",
            "app", "bootstrap", "config", "database", "public", "resources", "routes",
            "storage", "vendor", ".env", "deploy.php", "CHANGELOG.md"
          )
          $fullPaths = $items | ForEach-Object { Join-Path $src $_ }
          Compress-Archive -Path $fullPaths -DestinationPath $zip -CompressionLevel Optimal
          $size = [Math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Output "deploy.zip created: $size MB"
          # Restore cache directory
          if (Test-Path "$src\bootstrap\cache.bak") {
            Remove-Item "$src\bootstrap\cache" -Recurse -Force -ErrorAction SilentlyContinue
            Move-Item "$src\bootstrap\cache.bak" "$src\bootstrap\cache"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: deploy.zip
          fail_on_unmatched_files: true

      - name: Trigger deploy on server
        run: |
          curl -s --max-time 180 \
            -H "X-Admin-Email: ${{ secrets.ADMIN_EMAIL }}" \
            -H "X-Admin-Password: ${{ secrets.ADMIN_PASSWORD }}" \
            -H "X-Admin-Name: ${{ secrets.ADMIN_NAME }}" \
            "https://laravel.tunispromo.tn/deploy/check?token=${{ secrets.DEPLOY_TOKEN }}"