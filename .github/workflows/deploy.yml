name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    needs: ci
    uses: ./.github/workflows/deploy-package.yml
    with:
      version: ""
    secrets: inherit

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        run: |
          VER="${{ needs.package.outputs.version }}"
          if [ -z "$VER" ]; then
            VER="0.1.0"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          npm install -g git-cliff
          git-cliff --unreleased -o release-notes.md 2>/dev/null || echo "No changes for v${{ steps.version.outputs.version }}" > release-notes.md
          git-cliff -o CHANGELOG.md 2>/dev/null || true

      - name: Download deploy.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: deploy.zip
          fail_on_unmatched_files: true

  push-deploy:
    needs: [package, release]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: echo "version=${{ needs.package.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Download deploy.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Upload deploy archive to server
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          echo "Release: $VER"
          if curl -sf --max-time 300 \
            -F "file=@deploy.zip;filename=deploy.zip" \
            "https://laravel.tunispromo.tn/deploy/upload?token=${{ secrets.DEPLOY_TOKEN }}"; then
            echo "Deployed via /deploy/upload"
          elif curl -sf -X POST --max-time 300 \
            "https://laravel.tunispromo.tn/deploy/check?token=${{ secrets.DEPLOY_TOKEN }}"; then
            echo "Deployed via /deploy/check (GitHub API)"
          else
            echo "Deploy failed. Release created at:"
            echo "https://github.com/nreljed/laravel/releases/tag/$VER"
            echo "Manual deploy: download deploy.zip from release, upload to server, extract, then visit:"
            echo "https://laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
            exit 1
          fi
