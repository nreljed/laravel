name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip
          tools: composer:v2

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Assets
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          LFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          LFTP_HOST: ${{ secrets.FTP_SERVER }}
          LFTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          lftp << EOF
          open -u "$LFTP_USER","$LFTP_PASS" -p "$LFTP_PORT" "$LFTP_HOST"
          set ftp:ssl-allow no
          set net:timeout 30
          mirror --reverse --verbose --no-perms --delete \
            -X .git/ -X .github/ -X .gitignore -X .gitattributes \
            -X .env -X .env.example -X .env.production.example \
            -X database/database.sqlite \
            -X node_modules/ -X storage/ \
            -X vendor/bin/ -X vendor/**/tests/ -X vendor/**/test/ -X vendor/**/docs/ \
            -X bootstrap/cache/ -X public/hot -X public/build/hot \
            -X README.md -X phpunit.xml -X tests/ -X docs/ -X scripts/ -X sql/ \
            -X deploy.sh -X composer-setup.php -X composer.phar \
            -X *.md \
            . /home/advertis/domains/laravel.tunispromo.tn/public_html
          bye
          EOF

      - name: Update Production .env
        env:
          ENV_CONTENT: |
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=https://laravel.tunispromo.tn
            APP_LOCALE=en
            APP_FALLBACK_LOCALE=en
            BCRYPT_ROUNDS=12
            LOG_CHANNEL=stack
            LOG_LEVEL=error
            DB_CONNECTION=mysql
            DB_HOST=localhost
            DB_PORT=3306
            DB_DATABASE=advertis_lara584
            DB_USERNAME=advertis_lara584
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SESSION_DRIVER=database
            SESSION_LIFETIME=120
            SESSION_DOMAIN=.tunispromo.tn
            BROADCAST_CONNECTION=log
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=database
            CACHE_STORE=file
            DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
        run: |
          TEMP_ENV=$(printf '%s\n' "$ENV_CONTENT")
          curl -X POST "https://laravel.tunispromo.tn/deploy/update-env" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "token=${{ secrets.DEPLOY_TOKEN }}" \
            --data-urlencode "content=$TEMP_ENV"

      - name: Clear Cache and Migrate
        run: |
          curl -s "https://laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
