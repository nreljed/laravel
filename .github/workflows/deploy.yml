name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip
          tools: composer:v2

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Assets
        run: npm run build

      - name: Create lftp ignore file
        run: |
          cat > .lftp_ignore << 'EOF'
          .git/**
          .github/**
          .gitignore
          .gitattributes
          .env
          .env.example
          .env.production.example
          database/database.sqlite
          node_modules/**
          storage/**
          vendor/bin/**
          vendor/**/tests/**
          vendor/**/test/**
          vendor/**/docs/**
          bootstrap/cache/*
          public/hot
          public/build/hot
          README.md
          phpunit.xml
          tests/**
          docs/**
          scripts/**
          sql/**
          deploy.sh
          composer-setup.php
          composer.phar
          *.md
          EOF

      - name: Deploy via FTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          user: ${{ secrets.FTP_USERNAME }}
          pass: ${{ secrets.FTP_PASSWORD }}
          settings: 'set ftp:ssl-allow no; set net:timeout 30'
          localDir: '.'
          remoteDir: '/home/advertis/domains/laravel.tunispromo.tn/public_html'
          reverse: true
          ignoreFile: '.lftp_ignore'
          onlyNewer: false
          options: '--verbose --no-perms'

      - name: Update Production .env
        env:
          ENV_CONTENT: |
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=https://laravel.tunispromo.tn
            APP_LOCALE=en
            APP_FALLBACK_LOCALE=en
            BCRYPT_ROUNDS=12
            LOG_CHANNEL=stack
            LOG_LEVEL=error
            DB_CONNECTION=mysql
            DB_HOST=localhost
            DB_PORT=3306
            DB_DATABASE=advertis_lara584
            DB_USERNAME=advertis_lara584
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SESSION_DRIVER=database
            SESSION_LIFETIME=120
            SESSION_DOMAIN=.tunispromo.tn
            BROADCAST_CONNECTION=log
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=database
            CACHE_STORE=file
            DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
        run: |
          TEMP_ENV=$(printf '%s\n' "$ENV_CONTENT")
          curl -X POST "https://laravel.tunispromo.tn/deploy/update-env" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "token=${{ secrets.DEPLOY_TOKEN }}" \
            --data-urlencode "content=$TEMP_ENV"

      - name: Clear Cache and Migrate
        run: |
          curl -s "https://laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
