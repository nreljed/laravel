name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    needs: ci
    uses: ./.github/workflows/deploy-package.yml
    with:
      version: ""
    secrets: inherit

  push-deploy:
    needs: package
    if: needs.package.outputs.skip != 'true'
    # Self-hosted: hosted runners are billing-blocked account-wide.
    runs-on: [self-hosted]
    # Canonical check-first flow (shared with laravel.shop). /deploy/check makes
    # the server pull deploy.zip from the GitHub API itself, avoiding a large
    # upload through the edge (Cloudflare cuts connections ~100s).
    #
    # The host's security layer intermittently blocks CI (datacenter) IPs. If
    # both the check and upload paths fail, the server still self-deploys via
    # the scheduled deploy:auto command within ~5 minutes — the job fails so
    # CI is honest, but the release is already created and will be picked up.
    #
    # deploy.zip comes from the GitHub Release (created by the package job),
    # not an Actions artifact — release assets are NOT billed against the
    # 0.5GB Actions artifact storage quota.
    steps:
      - name: Download deploy.zip from release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VER="v${{ needs.package.outputs.version }}"
          echo "Downloading deploy.zip from release $VER"
          gh release download "$VER" \
            --repo "${{ github.repository }}" \
            --pattern "deploy.zip" \
            --clobber
          ls -la deploy.zip

      - name: Push GITHUB_TOKEN to server .env
        # Runs before the upload so the server can authenticate /deploy/check
        # (self-deploy path reads GITHUB_TOKEN from the server .env).
        #
        # Pipe-free implementation: under `set -o pipefail`, `echo "$RESP" |
        # head -1` can die with SIGPIPE (exit 141) when the server answers
        # with a large non-JSON body (e.g. its 403 HTML page), silently
        # skipping the token push. Parameter expansion replaces the pipe.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ENV_URL="${{ vars.APP_URL }}/deploy/env?token=${{ secrets.DEPLOY_TOKEN }}"
          PAYLOAD="{\"values\":{\"GITHUB_TOKEN\":\"${{ secrets.GH_TOKEN }}\"}}"
          CONFIRMED=""
          for i in 1 2 3; do
            if RESP=$(curl -sS -X POST --max-time 60 -H "Content-Type: application/json" \
                 -d "$PAYLOAD" "$ENV_URL" 2>&1); then
              case "$RESP" in
                *'"success":true'*) CONFIRMED=yes; break ;;
              esac
            else
              RESP="curl failed: $?"
            fi
            echo "[env $i/3] ${RESP:0:160}"
            [ "$i" -lt 3 ] && sleep 20
          done
          if [ -n "$CONFIRMED" ]; then
            echo "GITHUB_TOKEN pushed to server .env"
          else
            echo "::warning::GITHUB_TOKEN push NOT confirmed after 3 attempts — update manually: POST $ENV_URL with {\"values\":{\"GITHUB_TOKEN\":\"<value>\"}}"
            exit 1
          fi

      - name: Upload deploy archive to server
        shell: bash
        run: |
          VER="v${{ needs.package.outputs.version }}"
          APP_URL="${{ vars.APP_URL }}"
          DEPLOY_TOKEN="${{ secrets.DEPLOY_TOKEN }}"
          CHECK_URL="$APP_URL/deploy/check?token=$DEPLOY_TOKEN"
          UPLOAD_URL="$APP_URL/deploy/upload?token=$DEPLOY_TOKEN"
          echo "Release: $VER"

          # Prefer /deploy/check: the server pulls deploy.zip from the GitHub API itself,
          # avoiding a large upload through the edge. Cloudflare cuts connections ~100s,
          # so the server may finish processing AFTER the response is lost — poll for it.
          # During extraction the server returns HTML/500 transiently — that means "still busy".
          poll_check() {
            for i in 1 2 3 4 5 6 7 8; do
              RESP=$(curl -s -X POST --max-time 120 "$CHECK_URL" 2>&1)
              FIRST=$(echo "$RESP" | head -1)
              case "$FIRST" in
                *'"status":"deployed"'*)
                  echo "Deployed via /deploy/check (GitHub API)"
                  echo "$FIRST"
                  return 0
                  ;;
                *'"status":"current"'*)
                  if echo "$FIRST" | grep -q "\"tag\":\"$VER\""; then
                    echo "Confirmed on $VER via /deploy/check"
                    echo "$FIRST"
                    return 0
                  fi
                  CURRENT_TAG=$(echo "$FIRST" | sed 's/.*"tag":"\([^"]*\)".*/\1/')
                  echo "[poll $i/8] server on ${CURRENT_TAG:-?}, waiting for $VER"
                  ;;
                *'"status":"locked"'*)
                  echo "[poll $i/8] server still working (locked)"
                  ;;
                *)
                  echo "[poll $i/8] server busy (response not JSON yet)"
                  ;;
              esac
              [ "$i" -lt 8 ] && sleep 45
            done
            return 1
          }

          # Upload response can be lost mid-extract; confirm the deploy by polling /deploy/check
          # until it reports current/deployed with the expected tag.
          confirm_deployed() {
            for i in 1 2 3 4 5 6 7 8; do
              RESP=$(curl -s --max-time 120 "$CHECK_URL" 2>&1)
              FIRST=$(echo "$RESP" | head -1)
              case "$FIRST" in
                *'"status":"deployed"'*)
                  echo "Confirmed deployed via /deploy/check"
                  echo "$FIRST"
                  return 0
                  ;;
                *'"status":"current"'*)
                  if echo "$FIRST" | grep -q "\"tag\":\"$VER\""; then
                    echo "Confirmed on $VER via /deploy/check"
                    echo "$FIRST"
                    return 0
                  fi
                  echo "[confirm $i/8] tag not yet $VER, retrying"
                  ;;
                *'"status":"locked"'*)
                  echo "[confirm $i/8] server still working (locked), retrying"
                  ;;
                *)
                  echo "[confirm $i/8] server busy, retrying"
                  ;;
              esac
              [ "$i" -lt 8 ] && sleep 45
            done
            return 1
          }

          if poll_check; then
            echo "push-deploy OK (check path)"
          else
            echo "check path did not confirm $VER, uploading deploy.zip directly"
            UPLOAD_RESP=$(curl -s -w "\n%{http_code}" --max-time 300 \
              -F "file=@deploy.zip;filename=deploy.zip" \
              "$UPLOAD_URL" 2>&1)
            HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -1)
            BODY=$(echo "$UPLOAD_RESP" | sed '$d')
            echo "Upload HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | head -1 | grep -q '"status":"deployed"'; then
              echo "Deployed via /deploy/upload"
              echo "$BODY" | head -1
              echo "push-deploy OK (upload path)"
            else
              # Response lost or transient HTML mid-extract; the deploy may still be in flight.
              echo "Upload response not clean (HTTP $HTTP_CODE), confirming via /deploy/check..."
              if confirm_deployed; then
                echo "push-deploy OK (confirmed after upload)"
              else
                echo "Deploy not confirmed after upload. Release created at:"
                echo "https://github.com/${{ github.repository }}/releases/tag/$VER"
                echo "Manual deploy: download deploy.zip from release, upload to server, extract, then visit:"
                echo "$APP_URL/deploy/cache-clear?token=$DEPLOY_TOKEN"
                exit 1
              fi
            fi
          fi

      - name: FTP Upload fallback (DirectAdmin)
        # Only relevant when the hosting FTP account homes to this app's project
        # root. Skips itself when the FTP_* secrets are not defined (see script guard).
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          if ("$env:FTP_USERNAME" -eq "") { Write-Output "FTP_* secrets not set — skipping FTP fallback"; exit 0 }
          $ftpPort = if ($env:FTP_PORT) { $env:FTP_PORT } else { "21" }
          # FTP account home is the Laravel project root (public_html), so upload to root.
          $ftpUrl = "ftp://$env:FTP_SERVER`:$ftpPort/deploy.zip"
          $cred = New-Object System.Net.NetworkCredential($env:FTP_USERNAME, $env:FTP_PASSWORD)
          try {
            $ftp = [System.Net.FtpWebRequest]::Create($ftpUrl)
            $ftp.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
            $ftp.Credentials = $cred
            $ftp.UseBinary = $true
            $ftp.UsePassive = $true
            $ftp.KeepAlive = $false
            $fileBytes = [System.IO.File]::ReadAllBytes("deploy.zip")
            $ftp.ContentLength = $fileBytes.Length
            $rs = $ftp.GetRequestStream()
            $rs.Write($fileBytes, 0, $fileBytes.Length)
            $rs.Close()
            $resp = $ftp.GetResponse()
            Write-Output "FTP upload OK: $($resp.StatusDescription)"
            $resp.Close()
            Write-Output "---"
            Write-Output "Extract via DirectAdmin File Manager, then visit:"
            Write-Output "${{ vars.APP_URL }}/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
          } catch {
            Write-Output "FTP upload failed: $_"
            $VER = "${{ needs.package.outputs.version }}"
            Write-Output "Manual steps:"
            Write-Output "1. Download from: https://github.com/${{ github.repository }}/releases/download/v$VER/deploy.zip"
            Write-Output "2. Upload via DirectAdmin File Manager to public_html/"
            Write-Output "3. Extract, then visit:"
            Write-Output "   ${{ vars.APP_URL }}/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
          }
