name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    needs: ci
    uses: ./.github/workflows/deploy-package.yml
    with:
      version: ""
    secrets: inherit

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        run: |
          VER="${{ needs.package.outputs.version }}"
          if [ -z "$VER" ]; then
            VER="0.1.0"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          npm install -g git-cliff
          BASE_TAG=$(git tag --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$BASE_TAG" ]; then
            BASE_TAG="v0.1.0"
          fi
          echo "Release notes base: $BASE_TAG"
          git-cliff "$BASE_TAG..HEAD" --strip header -o release-notes.md 2>/dev/null || echo "No changes for v${{ steps.version.outputs.version }}" > release-notes.md
          git-cliff -o CHANGELOG.md 2>/dev/null || true

      - name: Download deploy.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: deploy.zip
          fail_on_unmatched_files: true

  push-deploy:
    needs: [package, release]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: echo "version=${{ needs.package.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Download deploy.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Upload deploy archive to server
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.version }}"
          echo "Release: $VER"
          # Capture upload response: check for JSON (real app) vs HTML (Cloudflare)
          UPLOAD_RESP=$(curl -s -w "\n%{http_code}" --max-time 300 \
            -F "file=@deploy.zip;filename=deploy.zip" \
            "${{ vars.APP_URL }}/deploy/upload?token=${{ secrets.DEPLOY_TOKEN }}" 2>&1)
          HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -1)
          BODY=$(echo "$UPLOAD_RESP" | sed '$d')
          if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | head -1 | grep -q '^{'; then
            echo "Deployed via /deploy/upload"
            echo "$BODY" | head -1
          elif CHECK_RESP=$(curl -s -X POST --max-time 300 \
            "${{ vars.APP_URL }}/deploy/check?token=${{ secrets.DEPLOY_TOKEN }}" 2>&1) \
            && echo "$CHECK_RESP" | head -1 | grep -q '^{'; then
            echo "Deployed via /deploy/check (GitHub API)"
            echo "$CHECK_RESP" | head -1
          else
            echo "Deploy failed. Release created at:"
            echo "https://github.com/${{ github.repository }}/releases/tag/$VER"
            echo "Manual deploy: download deploy.zip from release, upload to server, extract, then visit:"
            echo "${{ vars.APP_URL }}/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
            exit 1
          fi
