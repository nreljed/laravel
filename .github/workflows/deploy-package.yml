name: Build Deploy Package

on:
  workflow_call:
    inputs:
      version:
        description: "Version string for the deploy.zip"
        required: true
        type: string
    outputs:
      version:
        description: "The version used"
        value: ${{ jobs.package.outputs.version }}
      skip:
        description: "true when the computed tag already exists (superseded run)"
        value: ${{ jobs.package.outputs.skip }}

permissions:
  contents: write

jobs:
  package:
    # Self-hosted (win-runner-laravel): hosted runners are billing-blocked
    # account-wide. Bare run steps still execute under pwsh on this runner
    # (C:\tools\pwsh), matching windows-latest behavior.
    #
    # Runner switch (self-hosted ⇄ GitHub-hosted): pwsh/Compress-Archive make
    # this job Windows-bound, so it reads RUNNER_PACKAGE (self-hosted | windows-latest).
    runs-on: ${{ vars.RUNNER_PACKAGE || 'self-hosted' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    # Private vcs repos: nreljed/platform + nreljed/blog install via GH_TOKEN
    # (needs Contents: Read on those repos). Composer reads JSON from COMPOSER_AUTH.
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP
        # PHP 8.4 is preinstalled on the self-hosted Windows runner;
        # setup-php only runs on GitHub-hosted (windows-latest).
        if: vars.RUNNER_PACKAGE != 'self-hosted'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -ne "") {
            $ver = "${{ inputs.version }}"
          } else {
            $ver = "0.1.0"
            # Re-fetch tags so concurrent runs see releases created after checkout.
            git fetch origin --tags --force 2>$null
            # Deterministic bump from the highest reachable semver tag.
            # NOTE: git-cliff --bumped-version misresolves on this repo's merge
            # topology (it returns stale v0.1.34 instead of v0.5.0), so we
            # compute the next version directly from git.
            $lastTag = git tag --merged HEAD |
              Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
              Sort-Object { [version]($_ -replace '^v', '') } |
              Select-Object -Last 1
            if ($lastTag) {
              $seg = $lastTag.TrimStart('v').Split('.')
              $major = [int]$seg[0]; $minor = [int]$seg[1]; $patch = [int]$seg[2]
              $commits = git log "$lastTag..HEAD" --pretty=format:"%s%B"
              $bump = "patch"
              foreach ($c in $commits) {
                if ($c -match 'BREAKING CHANGE' -or $c -match '^[a-z]+(\([^)]*\))?!:') { $bump = "major"; break }
                if ($c -match '^feat') { $bump = "minor" }
              }
              switch ($bump) {
                "major" { $ver = "$($major + 1).0.0" }
                "minor" { $ver = "$major.$($minor + 1).0" }
                default { $ver = "$major.$minor.$($patch + 1)" }
              }
              Write-Output "Bumping from $lastTag (next: $ver)"
            } else {
              Write-Output "No semver tags found, starting at 0.1.0"
            }
          }
          # git exits non-zero when the tag is absent; swallow it and reset
          # LASTEXITCODE so the runner's implicit "exit $LASTEXITCODE" passes.
          git ls-remote --exit-code origin "refs/tags/v$ver" *> $null
          $skip = "false"
          if ($LASTEXITCODE -eq 0) {
            Write-Output "tag v$ver already exists - incrementing patch to find next free version"
            $seg = $ver.Split('.')
            $major = [int]$seg[0]; $minor = [int]$seg[1]; $patch = [int]$seg[2]
            do {
              $patch += 1
              $ver = "$major.$minor.$patch"
              git ls-remote --exit-code origin "refs/tags/v$ver" *> $null
            } while ($LASTEXITCODE -eq 0)
            Write-Output "Resolved to v$ver"
          }
          $global:LASTEXITCODE = 0
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "skip=$skip" >> $env:GITHUB_OUTPUT

      - name: Generate build .env (SQLite)
        shell: pwsh
        run: |
          $dbPath = "$((Get-Location).Path.Replace('\', '/'))/database/database.sqlite"
          @"
          APP_NAME=Laravel
          APP_ENV=local
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=$dbPath
          SESSION_DRIVER=file
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          DEPLOY_TOKEN=build
          GITHUB_TOKEN=build
          "@ | Set-Content -Path .env -Encoding UTF8
          New-Item -ItemType File -Path database/database.sqlite -Force

      - name: Install Composer dependencies (no-dev)
        # --no-dev keeps dev-only packages (laravel/boost, telescope, pint, pail...)
        # out of the deploy.zip. A dev-built vendor was the source of the
        # "Class Laravel\Boost\BoostServiceProvider not found" boot failure.
        run: composer install --no-dev --prefer-dist --no-interaction --no-scripts

      - name: Package Discover
        run: php artisan package:discover --ansi

      - name: Run migrations (SQLite build)
        run: php artisan migrate --force

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Check core dependency parity
        run: npm run check:core-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend assets
        run: npm run build

      - name: Strip dev dependencies
        run: composer install --no-dev --optimize-autoloader --no-scripts

      - name: Overwrite .env with production settings
        shell: pwsh
        run: |
          @'
          APP_NAME=Laravel
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ vars.APP_URL }}
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_DOMAIN=${{ vars.SESSION_DOMAIN }}
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          DB_MAINTENANCE_ENABLED=${{ vars.DB_MAINTENANCE_ENABLED || 'false' }}
          # Shared host: no persistent Node process, so Inertia SSR stays OFF.
          # Flip to true ONLY if the host runs node bootstrap/ssr/ssr.js.
          INERTIA_SSR_ENABLED=false
          '@ | Set-Content -Path .env -Encoding UTF8

      - name: Copy deploy script
        run: Copy-Item -Path scripts/deploy-cron.php -Destination deploy.php

      - name: Create deploy.zip
        shell: pwsh
        run: |
          $src = Get-Location
          $zip = "$src\deploy.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          # Laravel refuses to boot without bootstrap/cache existing, so the
          # directory itself MUST ship in deploy.zip (fresh servers have nothing).
          # Only the generated files are removed — they are rebuilt server-side by
          # package:discover after extraction — while cache/.gitignore stays so the
          # archive recreates the directory on fresh installs. Never move the dir
          # aside: a .bak inside bootstrap/ gets zipped and lands on the server.
          $cacheDir = "$src\bootstrap\cache"
          if (Test-Path $cacheDir) {
            Remove-Item "$cacheDir\packages.php", "$cacheDir\services.php" -Force -ErrorAction SilentlyContinue
          }
          $items = @(
            "artisan", "composer.json", "composer.lock", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml",
            "app", "bootstrap", "config", "database", "public", "resources", "routes",
            "storage", "vendor", "deploy.php"
          )
          $fullPaths = $items | ForEach-Object { Join-Path $src $_ }
          Compress-Archive -Path $fullPaths -DestinationPath $zip -CompressionLevel Optimal
          $size = [Math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Output "deploy.zip created: $size MB"

      - name: Verify deploy.zip carries the nreljed packages
        # A `path` composer repo installs as a junction, and Compress-Archive does
        # not follow junctions: the archive then ships an EMPTY vendor/nreljed/*
        # and the host boots without the platform classes ("Target class [view]
        # does not exist", every route 500). Fail the build here instead of
        # shipping that.
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path (Get-Location) "deploy.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @{}
            foreach ($entry in $archive.Entries) { $entries[$entry.FullName] = $entry.Length }
          } finally {
            $archive.Dispose()
          }
          $required = @(
            "vendor/nreljed/platform/src/PlatformServiceProvider.php",
            "vendor/nreljed/blog/composer.json",
            "vendor/nreljed/marketing-module/src/MarketingServiceProvider.php"
          )
          $missing = @()
          foreach ($needle in $required) {
            if (-not $entries.ContainsKey($needle) -or $entries[$needle] -le 0) {
              $missing += $needle
            }
          }
          if ($missing.Count -gt 0) {
            throw "deploy.zip is missing package files: $($missing -join ', ')"
          }
          Write-Output "deploy.zip carries: $($required -join ', ')"

      - name: Generate release notes
        shell: pwsh
        run: |
          npm install -g git-cliff
          $baseTag = git tag --merged HEAD |
            Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
            Sort-Object { [version]($_ -replace '^v', '') } |
            Select-Object -Last 1
          if (-not $baseTag) { $baseTag = "v0.1.0" }
          Write-Output "Release notes base: $baseTag"
          git-cliff "$baseTag..HEAD" --strip header -o release-notes.md 2>$null
          if (-not (Test-Path release-notes.md)) {
            Set-Content release-notes.md "No changes for v${{ steps.version.outputs.version }}"
          }
          git-cliff -o CHANGELOG.md 2>$null

      - name: Create GitHub Release (release assets, not Actions artifacts)
        if: steps.version.outputs.skip != 'true'
        # Creating the release here (instead of uploading an Actions artifact)
        # keeps deploy.zip in release storage, which is NOT billed against the
        # 0.5GB Actions artifact quota that kept failing on the free plan.
        #
        # Use `gh` CLI instead of softprops/action-gh-release: GitHub's
        # uploads.github.com began rejecting the action's streamed upload body
        # ("Error creating asset temp dir") on 2026-09-17, while gh's
        # Content-Length upload succeeds. On a failed rerun, the tag/release
        # may already exist with 0 or partial assets, so delete and recreate.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $VER = "v${{ steps.version.outputs.version }}"
          if (-not (Test-Path deploy.zip)) {
            throw "deploy.zip does not exist - create it before releasing"
          }
          gh release create $VER deploy.zip --title $VER --notes-file release-notes.md *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "Release $VER already exists (prior failed run) - deleting and recreating"
            gh release delete $VER --yes --cleanup-tag 2>$null
            gh release create $VER deploy.zip --title $VER --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
          Write-Output "Release ready: https://github.com/${{ github.repository }}/releases/tag/$VER"
