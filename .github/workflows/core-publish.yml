name: Publish dashboard-core

on:
  push:
    branches: [main]
    paths:
      - packages/dashboard-core/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      # GH_TOKEN must be a fine-grained PAT with Contents: Read+Write on the
      # nreljed/dashboard-core repo so the mirror push and gh release succeed.
      # gh reads GH_TOKEN from the environment automatically for `gh release
      # create`, so no extra gh login step is needed.
      - name: Authenticate git against github.com
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Real write-access probe: create a probe file on a throwaway branch and
      # delete the branch. Exercises Contents: Write on the core repo without
      # touching main's history. Fails fast if GH_TOKEN can't push to the repo.
      - name: Verify write access to core repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO="nreljed/dashboard-core"
          BRANCH="ci-write-probe"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null 2>&1 || true
          BASE_SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
          gh api -X POST "repos/$REPO/git/refs" \
            -f ref="refs/heads/$BRANCH" \
            -f sha="$BASE_SHA" >/dev/null
          gh api -X PUT "repos/$REPO/contents/.core-write-probe" \
            -f message="ci: verify write access" \
            -f content="cHJvYmU=" \
            -f branch="$BRANCH" >/dev/null
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null
          echo "Write access to $REPO confirmed."

      # Mirrors packages/dashboard-core into nreljed/dashboard-core, bumps the
      # patch version, tags vX.Y.Z, pushes main + tags, and creates a GitHub
      # release. Exits 0 when nothing functional changed, so this job is
      # idempotent. The version field bumped in packages/dashboard-core/
      # composer.json is intentionally not committed back here.
      - name: Publish dashboard-core
        id: publish
        run: |
          set +e
          OUTPUT=$(php scripts/core-publish.php 2>&1)
          CODE=$?
          printf '%s\n' "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then exit "$CODE"; fi
          VERSION=$(printf '%s\n' "$OUTPUT" | sed -nE 's/^Published nreljed\/dashboard-core v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Best-effort: after a real publish, nudge consuming apps (Shop, ...) to
      # pull the new version via repository_dispatch (event_type: core-updated).
      # The weekly cron in each consumer is the fallback, so a failed dispatch
      # never blocks the publish. GH_TOKEN must include the consumer repo with
      # Contents: Read+Write for the dispatch to succeed.
      - name: Dispatch core-updated to consumers
        if: steps.publish.outputs.version != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION="${{ steps.publish.outputs.version }}"
          for REPO in "nreljed/laravel.shop"; do
            if gh api -X POST "repos/$REPO/dispatches" \
              -f event_type="core-updated" \
              -f "client_payload[version]=v$VERSION" >/dev/null 2>&1; then
              echo "Dispatched core-updated v$VERSION to $REPO"
            else
              echo "WARN: dispatch to $REPO failed (check GH_TOKEN permissions on $REPO). Consumers catch up on their weekly schedule."
            fi
          done
