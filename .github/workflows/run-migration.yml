name: Run Pending Migrations (Production)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to run php artisan migrate --force on production'
        required: true
        default: 'no'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        if: inputs.confirm != 'yes'
        run: |
          echo "::error::Confirmation required — set confirm to 'yes' to run migrations"
          exit 1

      - name: Run php artisan migrate --force on production
        if: inputs.confirm == 'yes'
        run: |
          curl -sf --max-time 120 \
            -X POST \
            "https://laravel.tunispromo.tn/deploy/migrate?token=${{ secrets.DEPLOY_TOKEN }}"
