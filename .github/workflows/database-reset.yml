name: Database Reset (Production)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "RESET" to wipe and reseed the production database'
        required: true
        default: 'no'
      with_seed:
        description: 'Reseed demo content after wiping'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      purge_media:
        description: 'Also delete all uploaded media files'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        if: inputs.confirm != 'RESET'
        run: |
          echo "::error::Confirmation required — set confirm to 'RESET' to reset the database"
          exit 1

      - name: Reset database on production
        if: inputs.confirm == 'RESET'
        run: |
          curl -sf --max-time 600 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"token":"${{ secrets.DEPLOY_TOKEN }}","confirm":"${{ inputs.confirm }}","with_seed":"${{ inputs.with_seed }}","purge_media":"${{ inputs.purge_media }}"}' \
            "https://laravel.tunispromo.tn/deploy/reset"
