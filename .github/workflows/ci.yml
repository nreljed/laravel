name: CI Validation

on:
  workflow_call:
    inputs:
      skip-php-tests:
        description: "Skip PHP tests and Pint"
        type: boolean
        default: false
      skip-npm-tests:
        description: "Skip npm lint, typecheck, format, test, and build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}-${{ hashFiles('packages/dashboard-core/**') }}

      - name: Create .env
        run: cp .env.example .env

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Composer audit (security advisories)
        # Fails the build when composer.lock contains packages with known
        # security advisories (Packagist Security Advisories database).
        run: composer audit --no-interaction

      - name: Foundation check (core boundary)
        run: php scripts/foundation-check.php

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install npm dependencies
        run: npm ci

      - name: npm audit (security advisories)
        # Fails the build when package-lock.json contains packages with known
        # vulnerabilities at or above the "high" severity level.
        run: npm audit --audit-level=high

      - name: ESLint
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run lint

      - name: TypeScript check
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run typecheck

      - name: Prettier check
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run format:check

      - name: Frontend tests
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run test

      - name: Build frontend assets
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run build

      - name: PHP tests
        if: ${{ !inputs.skip-php-tests }}
        run: php artisan test --parallel --compact

      - name: Laravel Pint
        if: ${{ !inputs.skip-php-tests }}
        run: vendor/bin/pint --test
