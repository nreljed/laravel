name: CI Validation

on:
  workflow_call:
    inputs:
      skip-php-tests:
        description: "Skip PHP tests and Pint"
        type: boolean
        default: false
      skip-npm-tests:
        description: "Skip npm lint, typecheck, format, test, and build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    uses: nreljed/platform/.github/workflows/consumer-ci.yml@main
    with:
      skip-php-tests: ${{ inputs.skip-php-tests || false }}
      skip-npm-tests: ${{ inputs.skip-npm-tests || false }}
      php-tests-parallel: true
      # consumer-ci.yml defaults this to false, and the mono HAS a real vitest
      # suite (app shell + workspace packages). Passing true here overrode that
      # default and made the frontend test gate green even with zero tests
      # collected -- a silent false negative on every run. Omit it so the
      # default applies.
      # The called workflow cannot read this repo's `vars`, so the runner
      # switch is handed over as inputs (see consumer-ci.yml's header).
      runner: ${{ vars.RUNNER_CI || 'self-hosted' }}
      hosted-runner: ${{ vars.RUNNER_CI != 'self-hosted' }}
      run-e2e: true
    secrets: inherit

  # apps/laravel.shop and apps/laravel.booking are workspace-only and MONO-OWNED,
  # but the reusable consumer-ci.yml runs `artisan test` at the repo root, whose
  # phpunit.xml only covers tests/Feature. That left 53 shop + 23 booking test
  # files never executed in CI -- real, mono-owned tests with zero signal.
  #
  # They need their own environment: an independent composer install, their own
  # .env (now versioned as .env.example, which is what made this job possible),
  # their own sqlite file, and their OWN vite build -- view-rendering tests hit
  # @vite() and 500 without apps/<app>/public/build/manifest.json.
  #
  # Deliberately blocking. A continue-on-error version would be another silent
  # green, which is the exact failure mode removed from the validate job above.
  app-tests:
    name: ${{ matrix.app }} tests
    needs: validate
    if: ${{ !inputs.skip-php-tests }}
    runs-on: ${{ vars.RUNNER_CI || 'self-hosted' }}
    defaults:
      run:
        shell: bash
        working-directory: apps/${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        app: [laravel.shop, laravel.booking]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        # PHP 8.4 + composer are preinstalled on the self-hosted runner;
        # setup-php only runs on GitHub-hosted Linux (php.ini rename is not
        # concurrency-safe on the shared Windows runners).
        if: vars.RUNNER_CI != 'self-hosted'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Create .env + SQLite database
        run: |
          cp .env.example .env
          touch database/database.sqlite

      # The apps resolve nreljed/* from VCS, so they need the same token the
      # root install uses.
      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_TOKEN }}"}}'
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Generate application key + migrate
        run: |
          php artisan key:generate
          php artisan migrate --force

      # pnpm workspace install must run from the ROOT so the apps' deps are
      # linked alongside the shared lockfile. Step-level working-directory is
      # relative to the repo root, so this explicitly overrides the job default.
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: |
          command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@11
          pnpm install --frozen-lockfile

      - name: Build this app's frontend assets
        run: npm run build

      - name: Run PHPUnit
        run: php -d memory_limit=512M artisan test --compact

      - name: Laravel Pint
        # Pint is scoped per app too -- a formatting violation in
        # apps/ must fail here, not be discovered later on main.
        run: php vendor/bin/pint --test