name: CI Validation

on:
  workflow_call:
    inputs:
      skip-php-tests:
        description: "Skip PHP tests and Pint"
        type: boolean
        default: false
      skip-npm-tests:
        description: "Skip npm lint, typecheck, format, test, and build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    uses: nreljed/dashboard-core/.github/workflows/consumer-ci.yml@main
    with:
      skip-php-tests: ${{ inputs.skip-php-tests || false }}
      skip-npm-tests: ${{ inputs.skip-npm-tests || false }}
      php-tests-parallel: true
      pass-with-no-tests: true
    secrets: inherit