name: CI Validation

on:
  workflow_call:
    inputs:
      skip-php-tests:
        description: "Skip PHP tests and Pint"
        type: boolean
        default: false
      skip-npm-tests:
        description: "Skip npm lint, typecheck, format, test, and build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    # Self-hosted (win-runner-laravel): GitHub-hosted runners are billing-blocked
    # account-wide and kill jobs in ~5s before any step starts.
    runs-on: [self-hosted]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # PHP 8.4 + Node are preinstalled/configured on the runner machine;
      # setup-php validates extensions, setup-node pins the version.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Create .env
        run: cp .env.example .env

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Composer audit (security advisories)
        # Fails the build when composer.lock contains packages with known
        # security advisories (Packagist Security Advisories database).
        run: composer audit --no-interaction

      - name: Foundation check (core boundary)
        run: php scripts/foundation-check.php

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install npm dependencies
        # eslint v10 conflicts with eslint-plugin-react peers; strict npm ci ERESOLVEs
        run: npm ci --legacy-peer-deps

      - name: npm audit (security advisories)
        # Fails the build when package-lock.json contains packages with known
        # vulnerabilities at or above the "high" severity level.
        run: npm audit --audit-level=high

      - name: ESLint
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run lint

      - name: TypeScript check
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run typecheck

      - name: Prettier check
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run format:check

      - name: Frontend tests
        if: ${{ !inputs.skip-npm-tests }}
        # Monorepo has no frontend test files yet (--passWithNoTests so deploys
        # and dependabot PR checks aren't blocked by an empty vitest suite).
        run: npm run test -- --passWithNoTests

      - name: Build frontend assets
        if: ${{ !inputs.skip-npm-tests }}
        run: npm run build

      - name: PHP tests
        if: ${{ !inputs.skip-php-tests }}
        # -d covers this parent process; --parallel WORKERS inherit memory_limit
        # from the runner's C:\php\php.ini (bumped to 512M 2026-08-25) because
        # -d flags don't propagate to spawned processes.
        run: php -d memory_limit=512M artisan test --parallel --compact

      - name: Laravel Pint
        if: ${{ !inputs.skip-php-tests }}
        run: php vendor/bin/pint --test
