name: Dependency Sync (non-platform)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"
  repository_dispatch:
    types: [core-updated, blog-updated, marketing-updated, dependency-updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ${{ vars.RUNNER_CI || 'self-hosted' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        if: runner.os == 'Linux'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Sync composer deps across all apps
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: |
          composer update --with-all-dependencies --no-scripts --no-interaction
          for app in apps/laravel.shop apps/laravel.booking; do
            composer update --with-all-dependencies --no-install --no-scripts --no-interaction --working-dir="$app"
          done

      - name: Sync package mirrors
        run: node scripts/sync-mirrors.mjs --apply

      - name: Check for changes
        id: check
        run: |
          if git diff --exit-code -- composer.lock apps/laravel.shop/composer.lock apps/laravel.booking/composer.lock packages/ > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH="chore/dependency-sync-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git push origin --delete "$BRANCH" 2>/dev/null || true
          git branch -D "$BRANCH" 2>/dev/null || true

          git checkout -B "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock apps/laravel.shop/composer.lock apps/laravel.booking/composer.lock packages/
          git commit -m "chore: sync dependencies across fleet"
          git push --no-verify -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync dependencies across fleet" \
            --body "Automated dependency sync (\`dependency-sync.yml\`). Opens a PR because \`main\` is branch-protected."