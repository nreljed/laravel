name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.RUNNER_CI || 'self-hosted' }}
    defaults:
      run:
        shell: bash
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        # PHP 8.4 + composer are preinstalled on the self-hosted runner;
        # setup-php only runs on GitHub-hosted Linux (php.ini rename not
        # concurrency-safe on the shared Windows runners).
        if: vars.RUNNER_CI != 'self-hosted'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Cache Composer dependencies (GitHub-hosted only)
        if: vars.RUNNER_CI != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts --no-progress

      - name: Lint PHP
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null && echo "lint OK"

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Composer audit (security advisories)
        run: composer audit --no-interaction

      - name: Frontend boundary check
        run: php scripts/frontend-boundary-check.php

      - name: Run tests
        run: php vendor/bin/phpunit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ${{ vars.RUNNER_CI || 'self-hosted' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package versions
        shell: bash
        run: |
          COMPOSER_VERSION="$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' composer.json)"
          NPM_VERSION="$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json)"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$COMPOSER_VERSION" != "$TAG_VERSION" ] || [ "$NPM_VERSION" != "$TAG_VERSION" ]; then
            echo "version mismatch: tag v${TAG_VERSION} vs composer ${COMPOSER_VERSION} / npm ${NPM_VERSION}"
            exit 1
          fi
          echo "tag v${TAG_VERSION} matches composer ${COMPOSER_VERSION} and npm ${NPM_VERSION}"

      # GH_TOKEN must be a fine-grained PAT with Contents: Read+Write on the
      # nreljed/booking-module repo (same shared token used by the deploy
      # pipeline, see AGENTS.md). gh reads it from the environment directly.
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" -R nreljed/booking-module > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" \
              --repo nreljed/booking-module \
              --title "booking-module $TAG" \
              --generate-notes
          fi

      - name: Notify consumer (booking-update)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Notifying laravel.booking repo"
          gh api repos/nreljed/laravel.booking/actions/workflows/booking-update.yml/dispatches \
            --method POST \
            --field ref=main \
            --field inputs[tag]="$TAG" \
            --field inputs[branch]=main
          echo "Notified laravel.booking -> booking-update ($TAG)"