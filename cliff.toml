[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.breaking %} [breaking]{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = "(\\(\\w+\\))?\\s*", replace = "" },
]

[git.commit_parsers]
feat = { group = "Features", default_scope = "" }
fix = { group = "Bug Fixes", default_scope = "" }
docs = { group = "Documentation", default_scope = "" }
refactor = { group = "Refactoring", default_scope = "" }
perf = { group = "Performance", default_scope = "" }
style = { group = "Styling", default_scope = "" }
test = { group = "Testing", default_scope = "" }
chore = { group = "Chores", default_scope = "" }

[bump]
features = true
breaking = true

[github]
repo = "nreljed/laravel"
